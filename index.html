<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneaker Vault</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1b1d1f;--mut:#6b6f73;--acc:#e4381f;--ok:#1f7a4d;--line:#dcd9d2}
@media(prefers-color-scheme:dark){:root{--bg:#16181a;--card:#202326;--ink:#f2f1ee;--mut:#9a9fa4;--acc:#ff5a3d;--ok:#4cc58a;--line:#33373b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:2px solid var(--ink)}
.logo{font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:28px;letter-spacing:.5px;text-decoration:none;color:var(--ink)}
.logo b{color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:20px}
h1{font-family:Impact,"Arial Narrow Bold",sans-serif;font-weight:400;font-size:clamp(34px,8vw,64px);line-height:1;margin:10px 0}
.sub{color:var(--mut);margin:0 0 20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
button,input,select{font:inherit}
.chip{border:1.5px solid var(--ink);background:none;color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.card .in{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.price{font-weight:700;font-size:20px}
.cat{color:var(--mut);font-size:14px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sz{min-width:40px;padding:5px 8px;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:6px;cursor:pointer}
.sz.on{background:var(--ink);color:var(--bg)}
.sz:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stock{font-size:13px;color:var(--ok)}
.qty{width:60px;padding:6px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:18px;max-width:420px;margin:30px auto}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
input[type=text],input[type=password],input[type=number],input[type=url]{width:100%;padding:9px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
table{width:100%;border-collapse:collapse;background:var(--card)}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:10px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
td img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.form{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
.form .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
#toast.show{opacity:1}
footer{text-align:center;color:var(--mut);padding:30px 0;font-size:13px}
footer a{color:var(--mut)}
.err{color:var(--acc);margin:8px 0 0;min-height:1.2em}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <a class="logo" href="#">Sneaker<b>Vault</b></a>
  <div id="nav"></div>
</header>
<main id="app"></main>
<footer>SneakZone · Práctica #12 · <a href="#admin">Admin</a></footer>
<div id="toast"></div>

<script>
/* ========= CONFIGURACIÓN ========= */
// Pega aquí la URL de tu recurso en MockAPI (termina en /products)
const API = "https://6b00e9601c637a569e52a769.mockapi.io/Productos";
// Login del admin (por código, como pide la práctica)
const ADMIN = { user: "admin", pass: "1234" };

/* Estructura de cada producto en MockAPI:
   name (string), price (number), image (string/url), category (string),
   sizes (object)  ->  {"38": 5, "39": 3, "40": 0}   talla: stock          */

let products = [];
let filter = "Todas";
const app = document.getElementById("app");
const $ = (s, r = document) => r.querySelector(s);

/* ========= UTILIDADES ========= */
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove("show"), 2600);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n).toFixed(2);
const totalStock = p => Object.values(p.sizes || {}).reduce((a, b) => a + Number(b), 0);
const isAdmin = () => sessionStorage.getItem("admin") === "1";

async function api(path = "", opts = {}) {
  const r = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error("Error " + r.status);
  return r.json();
}
async function load() {
  try { products = await api(); }
  catch (e) { products = []; toast("No se pudo conectar con MockAPI. Revisa la URL en el código."); }
}

// "38:5, 39:3" <-> {"38":5,"39":3}
function parseSizes(txt) {
  const o = {};
  txt.split(",").map(s => s.trim()).filter(Boolean).forEach(pair => {
    const [k, v] = pair.split(":").map(x => x.trim());
    if (k) o[k] = Math.max(0, parseInt(v) || 0);
  });
  return o;
}
const sizesToText = o => Object.entries(o || {}).map(([k, v]) => `${k}:${v}`).join(", ");

/* ========= ROUTER ========= */
async function route() {
  const h = location.hash;
  renderNav();
  if (h === "#admin") {
    if (!isAdmin()) return renderLogin();
    await load(); return renderAdmin();
  }
  await load(); renderStore();
}
function renderNav() {
  $("#nav").innerHTML = isAdmin()
    ? `<button class="btn alt sm" onclick="logout()">Cerrar sesión</button>` : "";
}
window.addEventListener("hashchange", route);

/* ========= TIENDA ========= */
function renderStore() {
  const cats = ["Todas", ...new Set(products.map(p => p.category).filter(Boolean))];
  const list = products.filter(p => filter === "Todas" || p.category === filter);
  app.innerHTML = `
    <h1>Pisa fuerte.<br>Elige tu talla.</h1>
    <p class="sub">Zapatillas urbanas y deportivas con stock en tiempo real.</p>
    <div class="filters">${cats.map(c => `<button class="chip ${c === filter ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="grid">${list.map(card).join("") || "<p>No hay productos todavía. Agrégalos desde el panel de admin.</p>"}</div>`;
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.c; renderStore(); });
  app.querySelectorAll(".card").forEach(setupCard);
}
function card(p) {
  const sold = totalStock(p) === 0;
  return `<article class="card" data-id="${p.id}">
    <img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.removeAttribute('src')">
    <div class="in">
      <div class="cat">${esc(p.category)}</div>
      <strong>${esc(p.name)}</strong>
      <div class="price">${money(p.price)}</div>
      <div class="sizes">${Object.entries(p.sizes || {}).map(([t, s]) =>
        `<button class="sz" data-t="${esc(t)}" ${Number(s) <= 0 ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div>
      <div class="stock">${sold ? "Agotado" : "Elige una talla"}</div>
      <div class="row"><input class="qty" type="number" min="1" value="1" aria-label="Cantidad">
      <button class="btn buy" disabled>Comprar</button></div>
    </div></article>`;
}
function setupCard(el) {
  const p = products.find(x => x.id === el.dataset.id);
  let talla = null;
  const info = $(".stock", el), buy = $(".buy", el), qty = $(".qty", el);
  el.querySelectorAll(".sz").forEach(b => b.onclick = () => {
    talla = b.dataset.t;
    el.querySelectorAll(".sz").forEach(x => x.classList.toggle("on", x === b));
    info.textContent = `Quedan ${p.sizes[talla]} en talla ${talla}`;
    qty.max = p.sizes[talla]; buy.disabled = false;
  });
  buy.onclick = async () => {
    const n = parseInt(qty.value) || 1;
    buy.disabled = true;
    try {
      const fresh = await api("/" + p.id);           // stock actualizado
      const disp = Number(fresh.sizes[talla]);
      if (n < 1 || n > disp) { toast(`Solo quedan ${disp} en talla ${talla}`); return route(); }
      fresh.sizes[talla] = disp - n;                  // restar stock
      await api("/" + p.id, { method: "PUT", body: JSON.stringify({ sizes: fresh.sizes }) });
      toast(`Compra lista: ${n} × ${p.name} (talla ${talla}) — ${money(p.price * n)}`);
    } catch (e) { toast("No se pudo completar la compra"); }
    route();
  };
}

/* ========= LOGIN ========= */
function renderLogin() {
  app.innerHTML = `<form class="box" id="lf">
    <h2>Panel de administración</h2>
    <label>Usuario<input type="text" id="u" autocomplete="username"></label>
    <label>Contraseña<input type="password" id="pw" autocomplete="current-password"></label>
    <p class="err" id="le"></p>
    <button class="btn" type="submit">Entrar</button></form>`;
  $("#lf").onsubmit = e => {
    e.preventDefault();
    if ($("#u").value === ADMIN.user && $("#pw").value === ADMIN.pass) {
      sessionStorage.setItem("admin", "1"); route();
    } else $("#le").textContent = "Usuario o contraseña incorrectos.";
  };
}
function logout() { sessionStorage.removeItem("admin"); location.hash = ""; route(); }

/* ========= ADMIN (CRUD) ========= */
function renderAdmin() {
  app.innerHTML = `
    <h1>Admin</h1>
    <form class="form" id="pf">
      <strong id="ft">Nuevo producto</strong>
      <input type="hidden" id="pid">
      <div class="g">
        <label>Nombre<input type="text" id="pn" required></label>
        <label>Precio<input type="number" id="pp" min="0" step="0.01" required></label>
        <label>Categoría<input type="text" id="pc" required></label>
        <label>URL de imagen<input type="url" id="pi"></label>
      </div>
      <label>Tallas y stock (formato talla:cantidad, separadas por coma)
        <input type="text" id="ps" placeholder="38:5, 39:3, 40:8" required></label>
      <div class="row" style="margin-top:14px">
        <button class="btn" type="submit" id="sv">Guardar</button>
        <button class="btn alt" type="button" id="cn">Cancelar</button></div>
    </form>
    <div class="tw"><table><thead><tr><th></th><th>Nombre</th><th>Precio</th><th>Categoría</th><th>Tallas (stock)</th><th>Acciones</th></tr></thead>
    <tbody>${products.map(p => `<tr>
      <td><img src="${esc(p.image)}" alt="" onerror="this.removeAttribute('src')"></td>
      <td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${esc(p.category)}</td>
      <td>${esc(sizesToText(p.sizes))}</td>
      <td><div class="row"><button class="btn alt sm" data-e="${p.id}">Modificar</button>
      <button class="btn sm" data-d="${p.id}">Eliminar</button></div></td></tr>`).join("")
      || `<tr><td colspan="6">Sin productos. Crea el primero arriba.</td></tr>`}</tbody></table></div>`;

  const reset = () => { $("#pf").reset(); $("#pid").value = ""; $("#ft").textContent = "Nuevo producto"; };
  $("#cn").onclick = reset;

  app.querySelectorAll("[data-e]").forEach(b => b.onclick = () => {           // UPDATE (cargar)
    const p = products.find(x => x.id === b.dataset.e);
    $("#pid").value = p.id; $("#pn").value = p.name; $("#pp").value = p.price;
    $("#pc").value = p.category; $("#pi").value = p.image || ""; $("#ps").value = sizesToText(p.sizes);
    $("#ft").textContent = "Modificar producto"; scrollTo({ top: 0, behavior: "smooth" });
  });
  app.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {     // DELETE
    if (!confirm("¿Eliminar este producto?")) return;
    try { await api("/" + b.dataset.d, { method: "DELETE" }); toast("Producto eliminado"); } catch { toast("Error al eliminar"); }
    route();
  });
  $("#pf").onsubmit = async e => {                                              // CREATE / UPDATE
    e.preventDefault();
    const data = { name: $("#pn").value.trim(), price: Number($("#pp").value), category: $("#pc").value.trim(),
      image: $("#pi").value.trim(), sizes: parseSizes($("#ps").value) };
    const id = $("#pid").value;
    try {
      await api(id ? "/" + id : "", { method: id ? "PUT" : "POST", body: JSON.stringify(data) });
      toast(id ? "Producto modificado" : "Producto creado");
    } catch { toast("Error al guardar"); }
    route();
  };
}

route();
</script>
</body>
</html>
